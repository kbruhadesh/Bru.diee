# /etc/nginx/sites-available/bruhadesh-os
# Serves the static `out/` export. No Node process runs in production at all,
# so the only RAM cost on the B2s is nginx itself (a few MB).

server {
    listen 80;
    server_name _;

    root /var/www/bruhadesh-os;   # contents of the `out/` folder go here
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;
    gzip_min_length 1024;

    # hashed Next.js build assets — safe to cache forever
    location /_next/static/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # everything else (html, images, favicon, og.png)
    location / {
        try_files $uri $uri.html $uri/ =404;
        expires 1h;
    }
}
